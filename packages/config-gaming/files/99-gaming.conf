# Installed by debium (config-gaming).
# Override: same file name in /etc/sysctl.d/
# (an empty file there disables it).

# Split-lock mitigation pauses the thread on each split lock, slowing some
# Windows games under Wine/Proton. The leading "-" makes systemd-sysctl
# skip it on CPUs without split-lock detection.
-kernel.split_lock_mitigate = 0

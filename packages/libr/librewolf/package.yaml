name: librewolf
summary: Web browser from LibreWolf
homepage: https://librewolf.net/
inputs:
  - apt: {index: librewolf, package: librewolf}
alternatives:
  - {name: x-www-browser, link: /usr/bin/x-www-browser, path: /usr/bin/librewolf, priority: 70}
  - {name: gnome-www-browser, link: /usr/bin/gnome-www-browser, path: /usr/bin/librewolf, priority: 70}

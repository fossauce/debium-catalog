# Installed by debium (config-pipewire).
# Override: same file name in /etc/wireplumber/wireplumber.conf.d/
# (an empty file there disables it).

# HDMI and DisplayPort outputs (monitor speakers) rank below other outputs
# when WirePlumber picks the default.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
      }
    }
  }
]

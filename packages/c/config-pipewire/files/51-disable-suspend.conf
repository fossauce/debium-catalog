# Installed by debium (config-pipewire).
# Override: same file name in /etc/wireplumber/wireplumber.conf.d/
# (an empty file there disables it).

# Outputs do not suspend: no cut-off at the start of HDMI/DP sound, no USB
# audio pops. Microphones keep the default and are released when idle.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

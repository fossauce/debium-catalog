# Installed by debium (config-system).
# Override: same file name in /etc/tmpfiles.d/
# (a link to /dev/null there disables it).

# THP shrinker (kernel 6.12+): split huge pages more than 80% zero-filled.
# Matters when THP is "always".
w /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409

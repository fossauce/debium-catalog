# Installed by debium (config-system).
# Override: same file name in /etc/sysctl.d/
# (an empty file there disables it).

# Virtual memory. Swap tuning (swappiness, page-cluster) is left to the swap
# setup.
vm.vfs_cache_pressure = 50
# Fixed writeback limits instead of a share of RAM, which lets gigabytes of
# unwritten data build up (USB copies report done long before they are).
# 256/128 MiB: Pop!_OS's fix for btrfs stalls, also used by Bazzite.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
vm.dirty_writeback_centisecs = 1500
# No proactive compaction: the kernel docs note it adds latency jitter.
vm.compaction_proactiveness = 0

# Kernel
# No hard lockup detector; frees a CPU performance counter.
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2

# TCP
net.ipv4.tcp_mtu_probing = 1

# File watchers (IDEs, sync tools). fs.file-max is unset: systemd raises it
# to the maximum at boot.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192

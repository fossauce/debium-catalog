name: winehq-staging
summary: Wine staging from WineHQ
description: 64-bit and 32-bit, with winetricks.
homepage: https://www.winehq.org/
requires: [i386, sources-nonfree]
depends: [winetricks]
inputs:
  - apt: {index: winehq, package: winehq-staging}
  - apt: {index: winehq, package: wine-staging}
  - apt: {index: winehq, package: wine-staging-amd64}
  - apt: {index: winehq, package: wine-staging-i386}
    arch: i386

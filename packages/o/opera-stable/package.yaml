name: opera-stable
summary: Web browser from Opera
homepage: https://www.opera.com/
inputs:
  - apt: {index: opera, package: opera-stable}
alternatives:
  - {name: x-www-browser, link: /usr/bin/x-www-browser, path: /usr/bin/opera, priority: 120}
  - {name: gnome-www-browser, link: /usr/bin/gnome-www-browser, path: /usr/bin/opera, priority: 120}

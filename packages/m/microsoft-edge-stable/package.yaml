name: microsoft-edge-stable
summary: Web browser from Microsoft
homepage: https://www.microsoft.com/edge
inputs:
  - apt: {index: microsoft-edge, package: microsoft-edge-stable}
alternatives:
  - {name: x-www-browser, link: /usr/bin/x-www-browser, path: /usr/bin/microsoft-edge-stable, priority: 200}
  - {name: gnome-www-browser, link: /usr/bin/gnome-www-browser, path: /usr/bin/microsoft-edge-stable, priority: 200}
build:
  script: |
    for s in 16 24 32 48 64 128 256; do
      install -Dm644 "$DESTDIR/opt/microsoft/msedge/product_logo_$s.png" "$DESTDIR/usr/share/icons/hicolor/${s}x$s/apps/microsoft-edge.png"
    done
    ln -s microsoft-edge-stable "$DESTDIR/usr/bin/microsoft-edge"

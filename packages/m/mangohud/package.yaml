name: mangohud
summary: Vulkan and OpenGL overlay
description: Upstream build, 64-bit and 32-bit, with NVIDIA stats.
homepage: https://github.com/flightlessmango/MangoHud
license: MIT
version: 0.8.4
replaces-debian: true
depends: [libxkbcommon0, libwayland-client0]
inputs:
  - url: https://github.com/flightlessmango/MangoHud/releases/download/v{version}/MangoHud-{version}.r0.g992103e.tar.gz
    sha256: aa0b2a009552f5e7c50baabf361267a79ea5e5c0fea440786f3b202d51f57753
    size: 10282346
    arch: amd64
  - url: https://raw.githubusercontent.com/flightlessmango/MangoHud/v{version}/LICENSE
    sha256: 18503b2b95a4340a5c2a6854825e97a20f20a8ff06b971feb63654c45c9c482c
    size: 1072
    to: /usr/share/doc/mangohud/copyright
build:
  script: |
    tar -xf MangoHud-0.8.4.r0.g992103e/MangoHud/MangoHud-package.tar -C "$DESTDIR" --no-same-owner
    rm "$DESTDIR/usr/bin/mangoplot"
    cd "$DESTDIR/usr/lib/mangohud"
    ln -s lib32 lib; ln -s lib32 i686; ln -s lib32 i386-linux-gnu; ln -s lib32 i686-linux-gnu
    ln -s lib64 x86_64; ln -s lib64 x86_64-linux-gnu
    ln -s . lib64/x86_64; ln -s . lib64/x86_64-linux-gnu
    ln -s . lib32/i386-linux-gnu; ln -s . lib32/i686-linux-gnu; ln -s ../lib64 lib32/x86_64-linux-gnu

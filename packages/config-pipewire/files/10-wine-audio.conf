# Installed by debium (config-pipewire).
# Override: same file name in /etc/pipewire/pipewire-pulse.conf.d/
# (an empty file there disables it).

# Higher minimum pulse quantum for Wine, so 44100/48000 streams do not
# underrun; for games, dropouts matter more than latency. Matches the 64-bit
# and 32-bit Wine preloaders (many games are 32-bit).
pulse.rules = [
    {
        matches = [
            { application.process.binary = "wine64-preloader" }
            { application.process.binary = "wine-preloader" }
        ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
            }
        }
    }
]

name: floorp
summary: Web browser from Floorp
homepage: https://floorp.app/
inputs:
  - apt: {index: floorp, package: floorp}
alternatives:
  - {name: x-www-browser, link: /usr/bin/x-www-browser, path: /usr/bin/floorp, priority: 100}
  - {name: gnome-www-browser, link: /usr/bin/gnome-www-browser, path: /usr/bin/floorp, priority: 100}

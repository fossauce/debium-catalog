name: google-chrome-stable
summary: Web browser from Google
homepage: https://www.google.com/chrome/
inputs:
  - apt: {index: google-chrome, package: google-chrome-stable}
alternatives:
  - {name: x-www-browser, link: /usr/bin/x-www-browser, path: /usr/bin/google-chrome-stable, priority: 200}
  - {name: gnome-www-browser, link: /usr/bin/gnome-www-browser, path: /usr/bin/google-chrome-stable, priority: 200}
build:
  script: |
    for s in 16 24 32 48 64 128 256; do
      install -Dm644 "$DESTDIR/opt/google/chrome/product_logo_$s.png" "$DESTDIR/usr/share/icons/hicolor/${s}x$s/apps/google-chrome.png"
    done
    ln -s google-chrome-stable "$DESTDIR/usr/bin/google-chrome"
